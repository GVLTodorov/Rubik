# Runs as the non-root app user, so every writable path points at /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # React UI. 8080 is the single public port for hosts that route one port (render.yaml):
    # it serves the app and forwards the API, health check and Swagger below.
    server {
        listen 5173;
        listen 8080;
        root /srv/frontend;

        # The API and its health check, same-origin from the UI (as the Vite dev proxy does).
        location /api/ {
            proxy_pass http://127.0.0.1:5080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://127.0.0.1:5080;
        }

        location /swagger {
            proxy_pass http://127.0.0.1:5080;
            proxy_set_header Host $host;
        }

        # Never cache index.html, so a new deploy is picked up; hashed bundles can be cached.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
